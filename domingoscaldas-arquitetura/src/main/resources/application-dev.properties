# Desenvolvimento: tudo na mesma maquina, banco em memoria, valores padrao para rodar sem configurar nada.
# Cada valor pode ser sobrescrito por variavel de ambiente (ex.: export SERVER_PORT=9090).
server.port=${SERVER_PORT:8080}

# Servico independente de campeonatos (o campeonato-service local usa a 8083)
campeonato.service.url=${CAMPEONATO_SERVICE_URL:http://localhost:8083}
spring.cloud.openfeign.client.config.campeonato-service.connectTimeout=${CAMPEONATO_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.campeonato-service.readTimeout=${CAMPEONATO_READ_TIMEOUT:3000}

# Banco H2 em memoria (so em desenvolvimento)
spring.datasource.url=jdbc:h2:mem:domingoscaldasarquiteturadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
