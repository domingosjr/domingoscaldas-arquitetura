spring.application.name=domingoscaldas-arquitetura

# Banco de dados H2 em memoria (MySQL entra na etapa 3)
spring.datasource.url=jdbc:h2:mem:domingoscaldasarquiteturadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga de dados de demonstracao no startup (ProjectRunner)
app.runner.habilitado=true

# Documentacao OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Jackson: campos primitivos ausentes no JSON assumem o valor padrao (0/false) em vez de erro 400
spring.jackson.deserialization.fail-on-null-for-primitives=false
