spring.application.name=domingoscaldas-arquitetura

# Porta da aplicacao principal (o campeonato-service usa a 8083)
server.port=8080

# Banco de dados H2 em memoria (MySQL entra na etapa 3).
# Desde a etapa 2 a tabela campeonatos pertence ao banco do campeonato-service.
spring.datasource.url=jdbc:h2:mem:domingoscaldasarquiteturadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga de dados de demonstracao no startup (ProjectRunner) - sem nenhuma chamada remota
app.runner.habilitado=true

# Servico independente de campeonatos (Etapa 2): o endereco fica fora do codigo Java
campeonato.service.url=http://localhost:8083
# Sem estes timeouts o Feign esperaria 10 s (conexao) e 60 s (leitura) para perceber a indisponibilidade
spring.cloud.openfeign.client.config.campeonato-service.connectTimeout=2000
spring.cloud.openfeign.client.config.campeonato-service.readTimeout=3000
# Mostra cada chamada HTTP ao servico no console ("---> GET ..." / "<--- HTTP/1.1 200")
spring.cloud.openfeign.client.config.campeonato-service.loggerLevel=basic
logging.level.br.edu.infnet.domingoscaldas_arquitetura.campeonato.client.CampeonatoClient=DEBUG

# Documentacao OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Jackson: campos primitivos ausentes no JSON assumem o valor padrao (0/false) em vez de erro 400
spring.jackson.deserialization.fail-on-null-for-primitives=false
