spring.application.name=domingoscaldas-arquitetura

# Profile ativo vem do ambiente (SPRING_PROFILES_ACTIVE); sem ele, desenvolvimento.
# O que muda entre ambientes fica em application-dev.properties e application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuracao centralizada (Etapa 3): porta e URLs vem do config-server. "optional": sem ele a
# aplicacao sobe com os valores locais do profile.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# ---- comum a todos os ambientes ----
# Carga de dados de demonstracao no startup (ProjectRunner) - idempotente, sem nenhuma chamada remota
app.runner.habilitado=true
spring.jpa.properties.hibernate.format_sql=true

# Mostra cada chamada HTTP ao campeonato-service no console ("---> GET ..." / "<--- HTTP/1.1 200")
spring.cloud.openfeign.client.config.campeonato-service.loggerLevel=basic
logging.level.br.edu.infnet.domingoscaldas_arquitetura.campeonato.client.CampeonatoClient=DEBUG

# Documentacao OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Jackson: campos primitivos ausentes no JSON assumem o valor padrao (0/false) em vez de erro 400
spring.jackson.deserialization.fail-on-null-for-primitives=false
