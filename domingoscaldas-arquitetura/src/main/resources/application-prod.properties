# Producao: nenhum endereco, porta ou credencial e conhecido aqui - tudo precisa vir do ambiente
# (config-server ou variaveis). Sem valor padrao de proposito: se faltar configuracao, a aplicacao
# falha ao subir ("Could not resolve placeholder") em vez de rodar com um valor errado.
server.port=${SERVER_PORT}

campeonato.service.url=${CAMPEONATO_SERVICE_URL}
spring.cloud.openfeign.client.config.campeonato-service.connectTimeout=${CAMPEONATO_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.campeonato-service.readTimeout=${CAMPEONATO_READ_TIMEOUT:3000}

# Banco MySQL proprio da aplicacao principal (credenciais nunca ficam no repositorio)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# update: o esquema e criado pela aplicacao no primeiro start do container (sem ferramenta de migracao nesta etapa)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Spring Batch: cria as tabelas de metadados (BATCH_JOB_EXECUTION etc.) no MySQL da aplicacao principal
spring.batch.jdbc.initialize-schema=always

# RabbitMQ: endereco vem do config-server; credenciais so por variavel de ambiente
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
