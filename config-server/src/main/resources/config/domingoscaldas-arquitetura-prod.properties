# Aplicacao principal - ambiente de producao (containers na rede do Compose).
# O campeonato-service e localizado pelo NOME do servico na rede Docker, nunca por localhost.
server.port=8080
campeonato.service.url=http://campeonato-service:8083
spring.cloud.openfeign.client.config.campeonato-service.connectTimeout=2000
spring.cloud.openfeign.client.config.campeonato-service.readTimeout=3000

# Etapa 4: broker de mensagens (RabbitMQ) pelo nome do servico na rede do Compose
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
