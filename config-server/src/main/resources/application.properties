spring.application.name=config-server

# Porta do servidor de configuracao (as aplicacoes clientes usam CONFIG_SERVER_URL para encontra-lo)
server.port=${SERVER_PORT:8888}

# Backend "native": as configuracoes vem de arquivos no classpath (pasta config/), sem repositorio git.
# Arquivo por aplicacao e profile: <spring.application.name>-<profile>.properties
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config
