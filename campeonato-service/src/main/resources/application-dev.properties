# Desenvolvimento: banco em memoria e valores padrao para rodar sem configurar nada.
server.port=${SERVER_PORT:8083}

# API externa ViaCEP: endereco e timeouts fora do codigo Java
viacep.url=${VIACEP_URL:https://viacep.com.br/ws}
spring.cloud.openfeign.client.config.viacep.connectTimeout=2000
spring.cloud.openfeign.client.config.viacep.readTimeout=5000

# Banco H2 em memoria PROPRIO do servico (so em desenvolvimento)
spring.datasource.url=jdbc:h2:mem:campeonatodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
