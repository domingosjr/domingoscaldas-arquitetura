# Producao: porta, URL externa e credenciais vem do ambiente (config-server ou variaveis), sem valor padrao.
server.port=${SERVER_PORT}

viacep.url=${VIACEP_URL}
spring.cloud.openfeign.client.config.viacep.connectTimeout=2000
spring.cloud.openfeign.client.config.viacep.readTimeout=5000

# Banco MySQL proprio do campeonato-service (a aplicacao principal nao acessa este banco)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
