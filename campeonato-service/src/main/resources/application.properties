spring.application.name=campeonato-service

# Profile ativo vem do ambiente (SPRING_PROFILES_ACTIVE); sem ele, desenvolvimento.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuracao centralizada (Etapa 3): porta e URL do ViaCEP vem do config-server; "optional" = sobe sem ele
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# ---- comum a todos os ambientes ----
# Carga de dados de demonstracao no startup (ProjectRunner) - idempotente, sem CEP (nao depende de internet)
app.runner.habilitado=true
spring.jpa.properties.hibernate.format_sql=true

# Documentacao OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Cada operacao lista apenas as respostas HTTP declaradas em @ApiResponses
springdoc.override-with-generic-response=false
