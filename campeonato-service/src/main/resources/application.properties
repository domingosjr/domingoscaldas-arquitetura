spring.application.name=campeonato-service

# Porta propria do servico (a aplicacao principal fica na 8080)
server.port=8083

# Banco H2 em memoria PROPRIO do servico: a tabela campeonatos saiu do banco da aplicacao principal.
# MySQL entra na etapa 3.
spring.datasource.url=jdbc:h2:mem:campeonatodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga de dados de demonstracao no startup (ProjectRunner)
app.runner.habilitado=true

# API externa ViaCEP: endereco e timeouts fora do codigo Java
viacep.url=https://viacep.com.br/ws
spring.cloud.openfeign.client.config.viacep.connectTimeout=2000
spring.cloud.openfeign.client.config.viacep.readTimeout=5000

# Documentacao OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Cada operacao lista apenas as respostas HTTP declaradas em @ApiResponses
springdoc.override-with-generic-response=false
